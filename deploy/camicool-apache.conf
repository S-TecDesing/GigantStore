# Configuración de VirtualHost para CamiCool en Apache.
# Copiar a /etc/apache2/sites-available/camicool.conf en el servidor.
#
# Requiere los módulos de proxy activados (ver deploy/README.md):
#   sudo a2enmod proxy proxy_http

<VirtualHost *:80>
    ServerName TU_IP_O_DOMINIO_AQUI

    DocumentRoot /var/www/camicool
    <Directory /var/www/camicool>
        AllowOverride All
        Require all granted
    </Directory>

    # Todo el sitio (index.php, html/, css/, js/, php/) lo sirve Apache
    # normalmente desde DocumentRoot.

    # Únicamente las peticiones a /chat se reenvían internamente al
    # microservicio Flask (gunicorn) que corre en 127.0.0.1:5000.
    # El navegador nunca ve el puerto 5000: para él, /chat es parte
    # del mismo sitio (mismo origen), por eso el JavaScript no necesita
    # ningún cambio.
    ProxyPreserveHost On
    ProxyPass /chat http://127.0.0.1:5000/chat
    ProxyPassReverse /chat http://127.0.0.1:5000/chat

    ErrorLog ${APACHE_LOG_DIR}/camicool_error.log
    CustomLog ${APACHE_LOG_DIR}/camicool_access.log combined
</VirtualHost>
